<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Supply Chain Intelligence Platform</title>
    <meta http-equiv="refresh" content="0; url=https://testdemoqwenai2025-creator.github.io/Demo4AISupChn-Advanced/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #0F172A, #1E293B, #064E3B);
            color: white;
        }
        .container { text-align: center; padding: 40px; max-width: 600px; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 25px;
            border: 3px solid rgba(16,185,129,0.3); border-top-color: #10B981;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 {
            font-size: 28px; font-weight: 700; margin-bottom: 15px;
            background: linear-gradient(90deg, #10B981, #06B6D4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94A3B8; font-size: 18px; margin-bottom: 30px; }
        a {
            display: inline-block; padding: 14px 28px;
            background: linear-gradient(90deg, #059669, #0891B2);
            color: white; text-decoration: none; border-radius: 8px;
            font-weight: 600; transition: all 0.3s ease;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>AI Supply Chain Intelligence</h1>
        <p class="subtitle">Enterprise Risk Prediction & Command Center</p>
        <a href="https://testdemoqwenai2025-creator.github.io/Demo4AISupChn-Advanced/">Enter Platform →</a>
    </div>
</body>
</html>
